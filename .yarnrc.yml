enableGlobalCache: true

enableScripts: true

nmHoistingLimits: workspaces

nodeLinker: node-modules

packageExtensions:
  eslint-config-next@*:
    dependencies:
      next: "*"
      react: "*"
      react-dom: "*"
  next@*:
    dependencies:
      sass: "*"

yarnPath: .yarn/releases/yarn-4.18.0.cjs
