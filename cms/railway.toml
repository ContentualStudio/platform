# The Railway service builds from the repository root, not from cms/. Yarn 4
# needs the root yarn.lock, .yarnrc.yml and .yarn/releases in the build context,
# and `build:deps` builds the content-engine-vocabulary workspace, which only
# resolves from the workspace root. Every command below is therefore run through
# `yarn workspace`, which sets the working directory to cms/ for us.
[build]
builder = "RAILPACK"
buildCommand = "yarn workspace @contentual/cms build"
watchPatterns = [
  "cms/**",
  "packages/content-engine-vocabulary/**",
  "package.json",
  "yarn.lock",
  ".yarnrc.yml",
]

[deploy]
preDeployCommand = ["yarn workspace @contentual/cms migrate"]
startCommand = "yarn workspace @contentual/cms start"
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
